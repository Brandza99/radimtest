name: Github Actions Refresh

on:
  push:
    branches:
      - master
jobs:
  ime_joba:
    runs-on: ubuntu-latest
    environment: Master
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Print Project files
        run: ls -la

      - name: Print fake build message
        run:  echo "Build started"

      - name: Print fake deploy message
        run: echo "Deploy started"

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/gha-refresh-test:v2 -t ${{ secrets.DOCKERHUB_USERNAME }}/gha-refresh-test:latest .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image v2
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/gha-refresh-test:v2

      - name: Push Docker image latest
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/gha-refresh-test:latest


