name: Github Actions Refresh

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  DOCKER_IMAGE: brandza99/gha-refresh-test
  IMAGE_TAG: v4

jobs:
  ime_joba:
    runs-on: ubuntu-latest
    environment: Master
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Print Project files
        run: ls -la

      - name: Print fake build message
        run:  echo "Build started"

      - name: Print fake deploy message
        run: echo "Deploy started"

      - name: Build Docker image
        run: docker build -t $DOCKER_IMAGE:$IMAGE_TAG -t $DOCKER_IMAGE:latest .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image v3
        run: docker push $DOCKER_IMAGE:$IMAGE_TAG

      - name: Push Docker image latest
        run: docker push $DOCKER_IMAGE:latest


